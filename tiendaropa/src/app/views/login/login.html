<div class="contenedor">
  <h1>Iniciar sesión</h1>

  <div class="formulario">
    <label for="email">Correo</label>
    <input id="email" type="email" #correo>

    <label for="password">Contraseña</label>
    <input id="password" type="password" #clave>

    <button type="button" (click)="ingresar(correo.value, clave.value)">Ingresar</button>
  </div>

  @if (mensaje()) {
    <p class="mensaje">{{ mensaje() }}</p>
  }

  <p>¿No tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>
</div>
