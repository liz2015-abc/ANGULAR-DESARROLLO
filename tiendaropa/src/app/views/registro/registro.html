<div class="contenedor">
  <h1>Crear cuenta</h1>

  <form (ngSubmit)="registrar()">
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" type="text" [(ngModel)]="nombre">

    <label for="email">Correo</label>
    <input id="email" name="email" type="email" [(ngModel)]="email">

    <label for="password">Contraseña (mínimo 8 caracteres)</label>
    <input id="password" name="password" type="password" [(ngModel)]="password">

    <button type="submit">Registrarme</button>
  </form>

  @if (mensaje()) {
    <p class="mensaje">{{ mensaje() }}</p>
  }

  <p>¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
</div>
