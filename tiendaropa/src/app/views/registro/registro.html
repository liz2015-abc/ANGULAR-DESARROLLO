<div class="contenedor">
  <h1>Crear cuenta</h1>

  <div class="formulario">
    <label for="nombre">Nombre</label>
    <input id="nombre" type="text" #nombre>

    <label for="email">Correo</label>
    <input id="email" type="email" #correo>

    <label for="password">Contraseña (mínimo 8 caracteres)</label>
    <input id="password" type="password" #clave>

    <button type="button" (click)="registrar(nombre.value, correo.value, clave.value)">Registrarme</button>
  </div>

  @if (mensaje()) {
    <p class="mensaje">{{ mensaje() }}</p>
  }

  <p>¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
</div>
