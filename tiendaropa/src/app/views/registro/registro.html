<div class="fondo">
  <mat-card class="tarjeta">
    <h1>Crear cuenta</h1>
    <p class="subtitulo">Tienda Online de Ropa</p>

    <div class="formulario">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" placeholder="Tu nombre" #nombre>

      <label for="email">Correo</label>
      <input id="email" type="email" placeholder="correo@ejemplo.com" #correo>

      <label for="password">Contraseña (mínimo 8 caracteres)</label>
      <input id="password" type="password" placeholder="Tu contraseña" #clave>

      <button mat-flat-button type="button" (click)="registrar(nombre.value, correo.value, clave.value)">Registrarme</button>
    </div>

    @if (mensaje()) {
      <p class="mensaje">{{ mensaje() }}</p>
    }

    <p class="enlace">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
  </mat-card>
</div>
